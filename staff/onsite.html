<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#102b43"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="アイスパーク管理"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="app-icon.jpg"><title>アイスパークin流山 管理画面</title><script src="bridge.js"></script>
  <meta name="referrer" content="no-referrer">
  <base target="_top">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="theme.css"><script src="common.js"></script>
  <style>
  .list-row-top{flex-wrap:wrap}.all-exit-btn{white-space:normal}
  .onsite-kpi-number{font-size:40px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}.onsite-kpi-unit{font-size:14px;font-weight:500;letter-spacing:0;margin-left:5px}
  .band-row{display:grid;grid-template-columns:minmax(140px,.7fr) minmax(220px,1fr) auto;align-items:center;gap:10px 20px;padding:10px 14px;margin-bottom:6px}
  .band-id{font-weight:700;color:var(--brand-dark);overflow-wrap:anywhere}.band-row .time-meter{width:100%;margin:0}.band-row .exit-btn{justify-self:end;font-size:12px;padding:8px 12px;min-height:36px}
  @media(max-width:1100px){.band-row{grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px}.band-row .band-timing{grid-column:1 / -1;grid-row:2}.band-row .exit-btn{grid-column:2;grid-row:1}.band-row .time-meter{min-width:0}}
  .onsite-aid-summary{margin-top:18px;padding:14px 18px;border:1px solid #c6e8f5;border-radius:10px;background:#eef8fd;color:#526c83}
  .onsite-aid-summary-row{display:flex;align-items:center;flex-wrap:wrap;gap:12px 22px;font-size:14px}
  .onsite-aid-summary-row>strong{color:#126e95;font-size:14px}.onsite-aid-count{color:#126e95;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;margin:0 4px}.onsite-aid-summary small{font-size:13px}
  .onsite-aid-summary .btn{margin-left:auto;min-height:44px}.onsite-aid-note{font-size:12px;line-height:1.6;color:#526c83;margin:8px 0 0}.onsite-aid-note:empty{display:none}
  .onsite-aid-tag{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;background:#e7f6fc;color:#0a7299;font-size:13px;font-weight:700;margin-left:12px}.onsite-aid-tag[data-state=error]{background:#fff2d6;color:#8a5800}
  .onsite-aid-loans{margin-top:16px;padding:0 16px;border:1px solid #c6e8f5;border-radius:10px;background:#eef8fd}.onsite-aid-loans[hidden],.onsite-aid-tag[hidden]{display:none}
  .onsite-aid-loan{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 16px;min-height:52px;padding:12px 0}.onsite-aid-loan+.onsite-aid-loan{border-top:1px solid #cfe6f1}.onsite-aid-loan strong{font-size:16px;color:#126e95}.onsite-aid-loan-info{display:flex;align-items:center;flex-wrap:wrap;gap:8px;color:#526c83;font-size:14px}.onsite-aid-warning{padding:3px 8px;border-radius:6px;background:#fff2d6;color:#8a5800;font-size:12px;font-weight:700}
  .onsite-aid-return{min-height:44px;min-width:88px;white-space:nowrap}.onsite-aid-loan-info{flex:1;justify-content:flex-end}
  .onsite-aid-deadline{color:#126e95;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}.onsite-aid-remaining{color:#126e95;font-weight:700}.onsite-aid-deadline,.onsite-aid-remaining,.onsite-aid-warning{white-space:nowrap}
  @media(max-width:600px){.onsite-aid-summary{padding:12px}.onsite-aid-summary-row{gap:10px 16px}.onsite-aid-summary .btn{margin-left:0}.onsite-aid-tag{margin:6px 0 0;display:table}.onsite-aid-loans{padding:0 12px}}
  .premium-session-badge{display:inline-flex;align-items:center;margin-left:8px;padding:3px 9px;border-radius:999px;border:1px solid #d8b260;background:#fff6df;color:#775209;font-size:14px;font-weight:700;white-space:nowrap}.band-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}.second-session-btn{border-color:#bc9143;color:#775209;background:#fff9ed;min-height:44px}.second-session-btn:disabled{opacity:.6}
@media(max-width:1100px){.band-row .band-actions{grid-column:2;grid-row:1}}@media(max-width:600px){.band-actions{max-width:130px;flex-direction:column;align-items:stretch}.band-actions .btn{white-space:normal}}.second-session-control{display:flex;flex-direction:column;align-items:flex-start;gap:7px;margin-top:10px;max-width:100%;font-weight:500}.second-session-control .second-session-btn{font-size:14px;padding:8px 12px;min-height:44px;max-width:100%;white-space:normal;text-align:center}.second-session-feedback{margin:0;font-size:13px;line-height:1.5;overflow-wrap:anywhere;color:#526c83}.second-session-feedback[data-kind=error]{color:#a22232}.second-session-confirm{width:100%;padding:10px;border:1px solid #dfc68b;border-radius:8px;background:#fff9ed;box-sizing:border-box}.second-session-confirm p{font-size:13px;line-height:1.5;margin:0 0 8px}.second-session-confirm-actions{display:flex;flex-wrap:wrap;gap:6px}.second-session-confirm .btn{min-height:44px;white-space:normal}.second-session-control [hidden]{display:none!important}</style>
</head>
<body data-layout-page="OnSite" class="layout-refresh">
  <section id="operationBar" class="operation-bar" aria-label="本日の運営情報">
  <div class="operation-bar-items">
    <div class="operation-bar-item"><span class="operation-bar-label"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 11h16m-12 4h3"/></svg>運営方法</span><span class="operation-bar-value" id="operationBarStatus">読み込み中…</span></div>
    <div class="operation-bar-item"><span class="operation-bar-label"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>運営時間</span><span class="operation-bar-value" id="operationBarHours">読み込み中…</span></div>
    <div class="operation-bar-item"><span class="operation-bar-label"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>天気</span><span class="operation-bar-value" id="operationBarWeather">読み込み中…</span></div>
    <div class="operation-bar-item operation-mode-help"><span class="operation-bar-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg>運営モード</span><button type="button" id="operationModeTrigger" class="operation-mode-trigger" aria-expanded="false" aria-controls="operationModeHelp" aria-describedby="operationModeHelp"><span class="operation-bar-value" id="operationBarMode">読み込み中…</span><span class="operation-mode-info" aria-hidden="true">ⓘ</span><span class="operation-mode-sr">モードの説明</span></button><div id="operationModeHelp" class="operation-mode-popover" role="tooltip" hidden><strong>入場・呼出モードについて</strong><p id="operationModeBasis">氷上人数＋呼出中人数の合計で切り替わります。</p><div id="operationModeDefinitions"><p>モードの説明を読み込み中です。</p></div><p id="operationModeHelpStatus" class="operation-mode-note"></p></div></div>
    <div class="operation-bar-item operation-bar-count">
      <div class="operation-bar-count-text"><div class="operation-bar-count-numbers"><span class="operation-bar-value" id="operationBarCount">—</span><span id="operationBarCapacity" class="operation-bar-capacity"> / —人</span></div><span class="operation-bar-label">現在の氷上人数</span></div>
      <div id="operationBarOccupancy" class="operation-bar-track" role="progressbar" aria-label="氷上人数の定員に対する割合" aria-valuemin="0" aria-valuemax="100" aria-valuetext="読み込み中"><span id="operationBarFill" class="operation-bar-fill"></span></div>
    </div>
  </div><div id="operationBarMeta" class="operation-bar-meta" role="status">運営情報を取得しています</div>
</section>

  <div class="app-shell">
    <div id="adminSidebar" class="sidebar"></div>
    <div class="main-content">
      <div class="page-header">
        <div>
          <h1 class="page-header-title">在場中</h1>
          <div class="page-header-sub">氷上にいるお客様の確認・退場処理・延長を行います</div>
        </div>
        <div class="page-header-meta">
          <span class="chip" id="staffLabel">読み込み中...</span>
        </div>
      </div>

      <div id="errorBox" class="msg-error" style="display:none;"></div>

      <div class="card">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <div class="section-title" style="margin-bottom:0;">氷上にいるお客様</div>
          <div class="loading" id="updatedAt"></div>
        </div>
        <div class="layout-kpis mt-16"><div class="stat-card"><div class="value" id="layoutOnSitePeople">-</div><div class="label">氷上人数</div></div><div class="stat-card"><div class="value" id="totalTag">-</div><div class="label">在場組数</div></div><div class="stat-card"><div class="value" id="layoutNearExitPeople">-</div><div class="label">直近の退場予定（最大10人）</div></div></div>
        <section class="onsite-aid-summary" aria-label="滑走補助具の貸出状況">
          <div class="onsite-aid-summary-row"><strong>滑走補助具</strong><span>貸出中 <strong class="onsite-aid-count" id="onsiteAidInUse">—</strong><small>台</small></span><span>貸出可能 <strong class="onsite-aid-count" id="onsiteAidAvailable">—</strong><small>台</small></span><span>全<strong id="onsiteAidTotal">—</strong>台</span><a class="btn btn-outline btn-sm" id="onsiteAidManage">貸出・返却へ →</a></div>
          <p class="onsite-aid-note" id="onsiteAidNote">貸出状況を確認しています。</p>
        </section>
      </div>

      <div class="card"><div class="section-title">退場予定が近い10人</div><div id="nearExitList" style="white-space:pre-line;line-height:1.9;"></div><p class="loading">表示金額は今退場した場合の見込みです。最終料金は退場時に確定します。</p></div>
      <div id="list"></div>
    </div>
  </div>

  <script>
    var staffId = window.staffPortal.staffId;
    var sessionToken = window.staffPortal.sessionToken;
    var baseUrl = window.staffPortal.baseUrl;
    var onSiteAidView=null,onSiteAidStatus='loading',onSiteAidReturns=Object.create(null);
    function onSitePageUrl_(page) {
      var url = baseUrl + '?page=' + encodeURIComponent(page);
      
      return url;
    }
    function onSiteTicketKey_(value) {
      var text=String(value==null?'':value).trim();return /^[0-9]+$/.test(text)?text.replace(/^0+(?=[0-9])/,''):text;
    }
    function renderOnSiteAid_() {
      var ready=onSiteAidStatus==='ready'&&onSiteAidView;
      [['onsiteAidInUse','inUse'],['onsiteAidAvailable','available'],['onsiteAidTotal','total']].forEach(function(pair){document.getElementById(pair[0]).textContent=ready?String(onSiteAidView[pair[1]]):'—';});
      document.getElementById('onsiteAidNote').textContent=ready?'台数には入場前・退場後の未返却分も含みます。補助具の返却予定は貸出開始から1時間（お客様の退場予定とは別）です。時間表示は15秒ごとに更新します。':onSiteAidStatus==='error'?'貸出情報を取得できません。次回の更新で再確認します。':'貸出状況を確認しています。';
      document.querySelectorAll('#list > .card').forEach(function(card){
        var tag=card.querySelector('.onsite-aid-tag'),box=card.querySelector('.onsite-aid-loans');if(!tag||!box)return;
        box.replaceChildren();box.hidden=true;tag.hidden=false;tag.dataset.state=onSiteAidStatus;
        if(!ready){tag.textContent=onSiteAidStatus==='error'?'補助具：取得できません':'補助具：確認中';return;}
        var ticket=onSiteTicketKey_(card.dataset.ticket),date=card.dataset.ticketDate;
        var matches=onSiteAidView.active.filter(function(loan){return onSiteTicketKey_(loan.ticketNo)===ticket;});
        if(!date||matches.some(function(loan){return !loan.startDate;})){tag.textContent='補助具：貸出情報を照合できません';tag.dataset.state='error';return;}
        var loans=matches.filter(function(loan){return loan.startDate===date;}).slice().sort(function(a,b){return (Number(a.aidNo)||Infinity)-(Number(b.aidNo)||Infinity);});
        if(!loans.length){tag.hidden=true;tag.textContent='';return;}
        tag.textContent='補助具 '+loans.length+'台 貸出中';box.hidden=false;
        loans.forEach(function(loan){
          var row=document.createElement('div'),number=document.createElement('strong'),detail=document.createElement('div'),time=document.createElement('span');row.className='onsite-aid-loan';number.textContent='補助具 '+(Number(loan.aidNo)>0?String(loan.aidNo)+'番':'番号未割当')+'を貸出中';detail.className='onsite-aid-loan-info';
          time.textContent=(loan.startTimeLabel||'時刻不明')+'開始 ・ 経過'+(typeof loan.elapsedMin==='number'&&Number.isFinite(loan.elapsedMin)?String(loan.elapsedMin)+'分':'不明');detail.appendChild(time);
          var deadline=document.createElement('span');deadline.className='onsite-aid-deadline';deadline.textContent='返却予定 '+(loan.returnScheduledLabel||'未設定');detail.appendChild(deadline);
          var timing=document.createElement('span');
          if(typeof loan.overdueMinutes==='number'&&Number.isFinite(loan.overdueMinutes)&&loan.overdueMinutes>0){timing.className='onsite-aid-warning';timing.textContent='返却予定を'+loan.overdueMinutes+'分超過';}
          else if(typeof loan.remainingMinutes==='number'&&Number.isFinite(loan.remainingMinutes)&&loan.returnScheduledLabel){timing.className='onsite-aid-remaining';timing.textContent=loan.remainingMinutes>0?'返却まで残り'+loan.remainingMinutes+'分':'返却予定時刻です';}
          else{timing.className='onsite-aid-warning';timing.textContent='返却予定を確認してください';}
          detail.appendChild(timing);
          var button=document.createElement('button'),state=onSiteAidReturns[loan.logId];button.type='button';button.className='btn btn-outline btn-sm onsite-aid-return';button.dataset.log=loan.logId||'';
          button.textContent=state&&state.done?'返却済み':state&&state.busy?'返却中…':state?'返却を再確認':'返却';button.disabled=!loan.logId||!!(state&&(state.busy||state.done));
          button.setAttribute('aria-label','受付 '+card.dataset.ticket+' の補助具 '+(loan.aidNo||'番号未割当')+' を'+button.textContent);
          button.addEventListener('click',function(){returnOnSiteAid_(loan,card.dataset.ticket);});
          row.appendChild(number);row.appendChild(detail);row.appendChild(button);box.appendChild(row);
        });
      });
    }

    function returnOnSiteAid_(loan,ticketNo) {
      var id=loan.logId,state=onSiteAidReturns[id];if(!id||(state&&(state.busy||state.done)))return;
      if(!window.confirm('受付 '+ticketNo+' の補助具 '+(loan.aidNo||'番号未割当')+'番を返却します。実物を受け取りましたか？'+(state?' 前回と同じ操作番号で結果を再確認します。':'')))return;
      clearError();if(!state)state=onSiteAidReturns[id]={operation:makeStaffOperation_()};state.busy=true;renderOnSiteAid_();
      function done(fee){state.busy=false;state.done=true;renderOnSiteAid_();loadList();window.alert('補助具 '+(loan.aidNo||'番号未割当')+'番を返却しました。返却時の追加料金：¥'+Number(fee).toLocaleString());}
      function failed(err){state.busy=false;renderOnSiteAid_();showError('返却結果を確認できません：'+(err&&err.message?err.message:err)+'。最新の貸出状況を確認し、必要な場合は「返却を再確認」を押してください。');loadList();}
      staffRun(state.operation).withSuccessHandler(done).withFailureHandler(function(err){
        staffRun().withSuccessHandler(function(status){if(status&&status.state==='DONE')done(status.result);else failed(err);}).withFailureHandler(function(){failed(err);}).getStaffMutationStatus(state.operation.requestId);
      }).returnAidRentalForGuest(id);
    }

    function showError(msg) {
      var box = document.getElementById('errorBox');
      box.textContent = msg;
      box.style.display = 'block';
    }
    function clearError() {
      document.getElementById('errorBox').style.display = 'none';
    }

    function overBadge(overMinutes) {
      if (overMinutes === null || overMinutes === undefined) return '';
      if (overMinutes > 0) return '<span class="badge badge-warn">予定時刻を' + Math.floor(overMinutes) + '分超過</span>';
      return '<span class="badge badge-ok">残り' + Math.ceil(Math.abs(overMinutes)) + '分</span>';
    }
    function bandTimeLabel(w) {
      if(w.remainingMinutes==null)return '退場予定未設定';
      var label=w.overMinutes>0?'超過 '+w.overMinutes+'分':'残り '+w.remainingMinutes+'分';
      return label+' ／ 超過料金（見込み）¥'+w.overtimeCharge.toLocaleString()+(w.overMinutes>0&&w.overtimeCharge===0&&w.overtimeReason?'（'+w.overtimeReason+'）':'');
    }

    function memberLabel(type) {
      return type === 'ADULT' ? '大人' : type === 'CHILD' ? '子供' : (type || '');
    }

    function renderOnSiteKpi_(id,count,unit) {
      var box=document.getElementById(id);box.replaceChildren();var number=document.createElement('span'),label=document.createElement('span');number.className='onsite-kpi-number';number.textContent=String(count);label.className='onsite-kpi-unit';label.textContent=unit;box.appendChild(number);box.appendChild(label);
    }
    function render(list) {
      var savedInputs={};document.querySelectorAll('.extend-min').forEach(function(e){savedInputs[e.dataset.ticket]=e.value;});
      var upcoming=[];list.forEach(function(q){q.bands.forEach(function(w){if(w.exitScheduledAt)upcoming.push({ticket:q.ticketNo,band:w});});});
      upcoming.sort(function(a,b){return new Date(a.band.exitScheduledAt)-new Date(b.band.exitScheduledAt);});
      var nearBox=document.getElementById('nearExitList');nearBox.replaceChildren();upcoming.slice(0,10).forEach(function(p,i){if(i)nearBox.appendChild(document.createTextNode('\n'));nearBox.appendChild(document.createTextNode('受付 '));nearBox.appendChild(premiumTicketNumber_(p.ticket,p.band.premium===true));nearBox.appendChild(document.createTextNode('／バンド '+bandDisplayNo_(p.band.bandNo)+'（'+bandPassLabel_(p.band)+(p.band.sessionNumber===2?'・2回目':'')+'）　'+p.band.exitScheduledLabel+'　'+bandTimeLabel(p.band)));});if(!upcoming.length)nearBox.textContent='退場予定のある在場者はいません。';
      renderOnSiteKpi_('totalTag',list.length,'組');
      renderOnSiteKpi_('layoutOnSitePeople',list.reduce(function(n,q){return n+q.bands.length;},0),'名');
      renderOnSiteKpi_('layoutNearExitPeople',Math.min(10,upcoming.length),'名');
      var box = document.getElementById('list');
      if (list.length === 0) {
        box.innerHTML = '<div class="card"><div class="empty-hint">現在、氷上にいるお客様はいません</div></div>';
        return;
      }
      box.innerHTML = '';
      list.forEach(function (q) {
        var card = document.createElement('div');
        card.className = 'card';
        var bandsHtml = q.bands.map(function (w) {
          return '<div class="list-row band-row">' +
              '<div class="band-id">' + bandDisplayNo_(w.bandNo) + '（' + memberLabel(w.memberType) + '）' + bandPassLabelHtml_(w) + (w.sessionNumber===2?'<span class="premium-session-badge">2回目</span>':'') + secondSessionControlHtml_(w) + '</div>' +
              '<div class="band-timing">'+timeMeterHtml(w)+'</div>'+
              '<div class="band-actions">'+'<button class="btn '+(w.overtimeCharge>0?'btn-danger':'btn-outline')+' btn-sm exit-btn" data-band="' + w.bandNo + '">'+(w.overtimeCharge>0?'¥'+w.overtimeCharge.toLocaleString()+' 徴収・退場':'退場')+'</button></div>' +
          '</div>';
        }).join('');

        card.innerHTML =
          '<div class="list-row-top">' +
            '<div class="list-row-ticket">' + premiumTicketNumber_(q.ticketNo,q.hasPremium).outerHTML + '</div>' +
            overBadge(q.overMinutes) +
            '<button class="btn btn-sm all-exit-btn" data-ticket="'+q.ticketNo+'">未退場の全員（'+q.bands.length+'人）を退場</button>'+
          '</div>' +
          '<div class="list-row-sub">' +
            (q.customerName ? q.customerName + '　' : '') + '在場' + q.bands.length + '名' +
            (q.isNighter ? '　ナイター' : '') + '<span class="onsite-aid-tag" hidden></span>' +
          '</div>' +
          '<div class="list-row-sub">入場：' + (q.enteredAtLabel || '-') +
            '　退場予定：' + (q.exitScheduledLabel || '-') + '</div>' +
          '<div class="onsite-aid-loans" hidden></div>' +
          '<div class="mt-16">' + bandsHtml + '</div>' +
          '<div class="list-row-actions">' +
            '<input type="number" class="extend-min" data-ticket="' + q.ticketNo + '" placeholder="延長(分)" ' +
              'min="0" style="max-width:110px;">' +
            '<button class="btn btn-sm extend-btn" data-ticket="' + q.ticketNo + '">延長する</button>' +
          '</div>';
        card.dataset.ticket=String(q.ticketNo);card.dataset.ticketDate=q.ticketIssuedDate||'';
        box.appendChild(card);
      });
      renderOnSiteAid_();

      document.querySelectorAll('.extend-min').forEach(function(e){if(savedInputs[e.dataset.ticket]!=null)e.value=savedInputs[e.dataset.ticket];});
      document.querySelectorAll('.all-exit-btn').forEach(function(btn){btn.addEventListener('click',function(){var ticket=btn.dataset.ticket;confirmExitPayment('受付 '+ticket+' 全員',function(res){loadList();window.alert('受付 '+ticket+' 全員退場：徴収確認額 ¥'+res.charge.toLocaleString());},function(e){showError(e.message||e);},ticket);});});
      document.querySelectorAll('.exit-btn').forEach(function (btn) {
        btn.addEventListener('click', function () { exitBand(btn.getAttribute('data-band')); });
      });
      document.querySelectorAll('.second-session-control').forEach(function(box){var no=box.dataset.band;box.querySelector('.second-session-btn').addEventListener('click',function(){registerSecondSession_(no);});box.querySelector('.second-session-save').addEventListener('click',function(){saveSecondSession_(no);});box.querySelector('.second-session-cancel').addEventListener('click',function(){cancelSecondSession_(no);});});updateSecondSessionControls_();
      document.querySelectorAll('.extend-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var ticketNo = btn.getAttribute('data-ticket');
          var input = document.querySelector('.extend-min[data-ticket="' + ticketNo + '"]');
          var minutes = Number(input.value) || 0;
          if (minutes <= 0) { showError('延長する分数を入力してください'); return; }
          extendTicket(ticketNo, minutes);
        });
      });
    }

    var secondSessionStates_=Object.create(null);
    function secondSessionControlHtml_(w) {
      if(!w.secondSessionOffered||w.sessionNumber===2||w.secondSessionRegistered)return '';
      return '<div class="second-session-control" data-band="'+w.bandNo+'" data-overdue="'+(w.overMinutes>0?'yes':'no')+'">'+
        '<button type="button" class="btn btn-outline btn-sm second-session-btn" data-band="'+w.bandNo+'">2回目を滑走</button>'+
        '<p class="second-session-feedback" role="status" aria-live="polite" hidden></p>'+
        '<div class="second-session-confirm" role="group" aria-label="2回目の登録確認" hidden><p></p><div class="second-session-confirm-actions">'+
        '<button type="button" class="btn btn-sm second-session-save">この内容で登録</button>'+
        '<button type="button" class="btn btn-outline btn-sm second-session-cancel">戻る</button></div></div></div>';
    }
    function updateSecondSessionControls_() {
      document.querySelectorAll('.second-session-control').forEach(function(box){
        var state=secondSessionStates_[box.dataset.band]||{},overdue=box.dataset.overdue==='yes';
        var button=box.querySelector('.second-session-btn'),feedback=box.querySelector('.second-session-feedback'),confirm=box.querySelector('.second-session-confirm');
        button.disabled=!!state.busy||overdue;button.setAttribute('aria-busy',state.busy?'true':'false');
        button.textContent=state.phase==='saving'?'登録中…':state.phase==='reconciling'?'保存結果を確認中…':state.phase==='checking'?'確認中…':state.phase==='confirm'?'内容を確認してください':'2回目を滑走';
        feedback.textContent=state.message||(overdue?'終了予定時刻を過ぎているため登録できません。退場・料金を確認してください。':'');
        feedback.hidden=!feedback.textContent;feedback.dataset.kind=state.error||overdue?'error':'info';feedback.setAttribute('role',state.error?'alert':'status');
        confirm.hidden=state.phase!=='confirm';confirm.querySelector('p').textContent=state.quote?'新しい終了予定：'+state.quote.exitScheduledLabel+'。同日2回目として登録します（閉場時刻まで）。補助具の返却予定は変わりません。':'';
        confirm.querySelector('.second-session-save').disabled=state.phase!=='confirm';
      });
    }
    function secondSessionRequest_(action,args,operation,success,failure) {
      try {
        var runner=staffRun(operation).withSuccessHandler(function(value){try{success(value);}catch(err){failure(err);}}).withFailureHandler(failure);
        runner[action].apply(runner,args);
      } catch(err) {failure(err);}
    }
    function failSecondSession_(bandNo,err) {
      var state=secondSessionStates_[bandNo]||(secondSessionStates_[bandNo]={});
      state.busy=false;state.phase='error';state.error=true;state.message=String(err&&err.message||err||'結果を確認できません。');if(/Failed to fetch|NetworkError|Load failed|network/i.test(state.message))state.message='通信に失敗しました。回線を確認して、もう一度お試しください。';
      updateSecondSessionControls_();
      if(!Array.from(document.querySelectorAll('.second-session-control')).some(function(b){return b.dataset.band===bandNo;}))showError(state.message);
    }
    function registerSecondSession_(bandNo) {
      var state=secondSessionStates_[bandNo]||(secondSessionStates_[bandNo]={});if(state.busy)return;
      state.busy=true;state.phase='checking';state.error=false;state.message='利用条件と終了予定時刻を確認しています…';clearError();updateSecondSessionControls_();
      secondSessionRequest_('getPremiumSecondSessionQuote',[bandNo],null,function(quote){
        if(!quote||!quote.exitScheduledLabel)throw Error('確認結果を取得できませんでした。もう一度お試しください。');
        if(quote.alreadyRegistered){state.busy=false;state.phase='done';state.message='2回目は登録済みです。終了予定 '+quote.exitScheduledLabel;updateSecondSessionControls_();loadList();return;}
        state.quote=quote;state.phase='confirm';state.message='終了予定を確認し、「この内容で登録」を押してください。';updateSecondSessionControls_();
      },function(err){failSecondSession_(bandNo,err);});
    }
    function saveSecondSession_(bandNo) {
      var state=secondSessionStates_[bandNo];if(!state||state.phase!=='confirm'||!state.quote)return;
      state.phase='saving';state.message='2回目を登録しています…';try{state.operation=makeStaffOperation_();}catch(err){failSecondSession_(bandNo,err);return;}updateSecondSessionControls_();
      function done(result){state.busy=false;state.phase='done';state.error=false;state.message='2回目を登録しました。終了予定 '+result.exitScheduledLabel;updateSecondSessionControls_();loadList();}
      secondSessionRequest_('startPremiumSecondSession',[bandNo,state.quote.version],state.operation,done,function(err){
        state.phase='reconciling';state.message='保存結果を確認しています。続けて登録を押さずにお待ちください。';updateSecondSessionControls_();
        secondSessionRequest_('getPremiumSecondSessionQuote',[bandNo],null,function(saved){if(saved&&saved.alreadyRegistered)done(saved);else failSecondSession_(bandNo,err);},function(){failSecondSession_(bandNo,err);});
      });
    }
    function cancelSecondSession_(bandNo) {
      var state=secondSessionStates_[bandNo];if(!state||state.phase!=='confirm')return;
      state.busy=false;state.phase='idle';state.error=false;state.message='登録を取りやめました。';state.quote=null;updateSecondSessionControls_();
    }
        function exitBand(bandNo) {
      clearError();
      confirmExitPayment(bandNo,function(res){
          loadList();
          window.alert('バンド '+bandDisplayNo_(bandNo)+' 退場確定：'+(res.charge>0?'徴収確認済み ¥'+res.charge.toLocaleString():'追加料金なし'));
      },function(err){showError(err.message||err);});
    }

    function extendTicket(ticketNo, minutes) {
      clearError();
      staffRun()
        .withSuccessHandler(function () { loadList(); })
        .withFailureHandler(function (err) { showError((err && err.message ? err.message : err)); })
        .applyGroupExtension(ticketNo, minutes, staffId);
    }

    var onSiteVersion=0;
    function loadList() {
      var version=++onSiteVersion;
      if(onSiteAidStatus!=='ready')onSiteAidStatus='loading';renderOnSiteAid_();
      staffRun()
        .withSuccessHandler(function (list) {
          if(version!==onSiteVersion)return;
          render(list);
          document.getElementById('updatedAt').textContent = '更新：' + new Date().toLocaleTimeString('ja-JP');
        })
        .withFailureHandler(function (err) {
          if(version!==onSiteVersion)return;
          showError('一覧の取得に失敗しました：' + (err && err.message ? err.message : err));
        })
        .getOnSiteView();
      staffRun().withSuccessHandler(function(data){
        if(version!==onSiteVersion)return;
        if(!data||!Array.isArray(data.active)||!['inUse','available','total'].every(function(key){return typeof data[key]==='number'&&Number.isFinite(data[key]);})){onSiteAidView=null;onSiteAidStatus='error';}
        else{onSiteAidView=data;onSiteAidStatus='ready';}renderOnSiteAid_();
      }).withFailureHandler(function(){if(version!==onSiteVersion)return;onSiteAidView=null;onSiteAidStatus='error';renderOnSiteAid_();}).getAidInventoryView();
    }

    function loadStaffLabel() {
      if (!staffId) return;
      staffRun()
        .withSuccessHandler(function (staff) {
          if (staff) {
            document.getElementById('staffLabel').textContent =
              staff.staffName + (staff.role === 'ADMIN' ? '（管理者）' : '');
          }
        })
        .getStaffById(staffId);
    }

    renderAdminSidebar('onsite');
    document.getElementById('onsiteAidManage').href=onSitePageUrl_('aidinventory');
    loadStaffLabel();
    loadList();
    setInterval(loadList, 15000);
  </script>
</body>
</html>
