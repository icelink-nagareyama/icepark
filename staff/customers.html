<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#102b43"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="アイスパーク管理"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="app-icon.jpg"><title>アイスパークin流山 管理画面</title><script src="bridge.js"></script>
  <meta name="referrer" content="no-referrer">
  <base target="_top">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="theme.css"><script src="common.js"></script>
</head>
<body data-layout-page="Customers" class="layout-refresh">
  <section id="operationBar" class="operation-bar" aria-label="本日の運営情報">
  <div class="operation-bar-items">
    <div class="operation-bar-item"><span class="operation-bar-label"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 11h16m-12 4h3"/></svg>運営方法</span><span class="operation-bar-value" id="operationBarStatus">読み込み中…</span></div>
    <div class="operation-bar-item"><span class="operation-bar-label"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>運営時間</span><span class="operation-bar-value" id="operationBarHours">読み込み中…</span></div>
    <div class="operation-bar-item"><span class="operation-bar-label"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>天気</span><span class="operation-bar-value" id="operationBarWeather">読み込み中…</span></div>
    <div class="operation-bar-item operation-mode-help"><span class="operation-bar-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg>運営モード</span><button type="button" id="operationModeTrigger" class="operation-mode-trigger" aria-expanded="false" aria-controls="operationModeHelp" aria-describedby="operationModeHelp"><span class="operation-bar-value" id="operationBarMode">読み込み中…</span><span class="operation-mode-info" aria-hidden="true">ⓘ</span><span class="operation-mode-sr">モードの説明</span></button><div id="operationModeHelp" class="operation-mode-popover" role="tooltip" hidden><strong>入場・呼出モードについて</strong><p id="operationModeBasis">氷上人数＋呼出中人数の合計で切り替わります。</p><div id="operationModeDefinitions"><p>モードの説明を読み込み中です。</p></div><p id="operationModeHelpStatus" class="operation-mode-note"></p></div></div>
    <div class="operation-bar-item operation-bar-count">
      <div class="operation-bar-count-text"><div class="operation-bar-count-numbers"><span class="operation-bar-value" id="operationBarCount">—</span><span id="operationBarCapacity" class="operation-bar-capacity"> / —人</span></div><span class="operation-bar-label">現在の氷上人数</span></div>
      <div id="operationBarOccupancy" class="operation-bar-track" role="progressbar" aria-label="氷上人数の定員に対する割合" aria-valuemin="0" aria-valuemax="100" aria-valuetext="読み込み中"><span id="operationBarFill" class="operation-bar-fill"></span></div>
    </div>
  </div><div id="operationBarMeta" class="operation-bar-meta" role="status">運営情報を取得しています</div>
</section>

  <div class="app-shell">
    <div id="adminSidebar" class="sidebar"></div>
    <div class="main-content">
      <div class="page-header">
        <div>
          <h1 class="page-header-title">顧客管理</h1>
          <div class="page-header-sub">シーズンパス・回数券の保有者が対象です。氏名・パス番号・LINE IDで検索できます。</div>
        </div>
        <div class="page-header-meta">
          <span class="chip" id="staffLabel">読み込み中...</span>
        </div>
      </div>

      <div id="errorBox" class="msg-error" style="display:none;"></div>

      <div class="center" style="margin-bottom:8px;">
        <a href="#" id="toSeasonPassLink" style="font-size:13px;">→ シーズンパスの新規発行・LINE申込の支払完了はこちら</a>
      </div>

      <div class="card">
        <div class="field">
          <label>氏名（部分一致）・パス番号・LINE IDで検索</label>
          <input type="text" id="searchQuery" placeholder="例：山田 / SP0001">
        </div>
        <button class="btn" id="searchBtn" style="width:100%;">検索する</button>
        <p class="loading center mt-16">※ シーズンパス・回数券をお持ちのお客様が対象です</p>
      </div>

      <div class="card" id="resultsCard" style="display:none;">
        <div class="section-title">検索結果</div>
        <div id="resultsList"></div>
        <div class="center mt-16" id="searchPager" hidden>
          <button class="btn btn-outline" id="searchPrev" style="min-height:44px;">前へ</button>
          <span id="searchPageInfo" role="status" aria-live="polite"></span>
          <button class="btn btn-outline" id="searchNext" style="min-height:44px;">次へ</button>
        </div>
      </div>

      <div class="card" id="detailCard" style="display:none;">
        <div class="list-row-top">
          <div class="list-row-ticket" id="detailName">-</div>
          <span class="tag" id="detailStatus"></span>
        </div>
        <div class="list-row-sub" id="detailPlan"></div>
        <div class="list-row-sub" id="detailValid"></div>
        <div class="list-row-sub" id="detailUsage"></div>
        <div class="list-row-sub" id="detailLastUsed"></div>
        <div class="list-row-sub" id="detailReentryBlocked" style="color:#b45309;"></div>

        <div id="overrideBox" style="display:none;" class="mt-16">
          <div class="field">
            <label>特例で追加の入場を許可する理由</label>
            <input type="text" id="overrideReason" placeholder="例：整氷トラブルによる一時退場のため">
          </div>
          <button class="btn btn-outline" id="overrideBtn" style="width:100%;">特例で許可する（管理者のみ）</button>
        </div>

        <div class="section-title mt-16">来場履歴（直近10件）</div>
        <div id="visitsList"></div>
      </div>
    </div>
  </div>

  <script>
    var staffId = window.staffPortal.staffId;
    var sessionToken = window.staffPortal.sessionToken;
    var baseUrl = window.staffPortal.baseUrl;

    var STATUS_LABEL = { ACTIVE: 'ACTIVE', EXPIRED: 'EXPIRED' };
    var QSTATUS_LABEL = {
      WAITING: '待機中', CALLED: '呼出中', ON_ICE: '氷上', EXITED: '退場済', MISSED: '不成立', CANCELLED: '取消',
    };

    function showError(msg) {
      var box = document.getElementById('errorBox');
      box.textContent = msg;
      box.style.display = 'block';
    }
    function clearError() { document.getElementById('errorBox').style.display = 'none'; }

    document.getElementById('toSeasonPassLink').addEventListener('click', function (e) {
      e.preventDefault();
      window.top.location.href = baseUrl + '?page=seasonpass';
    });

    var searchGeneration=0,detailGeneration=0,searchState={query:'',page:1,totalPages:0,busy:false};
    function searchBusy_(busy){searchState.busy=busy;document.getElementById('searchBtn').disabled=busy;document.getElementById('resultsCard').setAttribute('aria-busy',String(busy));document.getElementById('searchPrev').disabled=busy||searchState.page<=1;document.getElementById('searchNext').disabled=busy||searchState.page>=searchState.totalPages;}
    function searchPage_(query,page){
      clearError();if(!query){showError('検索キーワードを入力してください');return;}
      var generation=++searchGeneration;++detailGeneration;searchState.query=query;document.getElementById('detailCard').style.display='none';document.getElementById('resultsCard').style.display='block';document.getElementById('searchPager').hidden=false;document.getElementById('searchPageInfo').textContent='検索中…';searchBusy_(true);
      staffRun().withSuccessHandler(function(data){if(generation!==searchGeneration)return;renderResults(data);searchBusy_(false);}).withFailureHandler(function(err){if(generation!==searchGeneration)return;searchBusy_(false);document.getElementById('searchPageInfo').textContent='';showError(String(err&&err.message||err));}).searchCustomersPage(query,page,25);
    }
    document.getElementById('searchBtn').addEventListener('click',function(){searchPage_(document.getElementById('searchQuery').value.trim(),1);});
    document.getElementById('searchQuery').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.isComposing){e.preventDefault();searchPage_(this.value.trim(),1);}});
    document.getElementById('searchPrev').addEventListener('click',function(){if(!this.disabled)searchPage_(searchState.query,searchState.page-1);});
    document.getElementById('searchNext').addEventListener('click',function(){if(!this.disabled)searchPage_(searchState.query,searchState.page+1);});
    function renderResults(data){
      searchState.page=data.page;searchState.totalPages=data.totalPages;
      var box=document.getElementById('resultsList');box.textContent='';
      document.getElementById('searchPager').hidden=false;
      document.getElementById('searchPageInfo').textContent=data.total+'件 / '+data.page+' / '+Math.max(1,data.totalPages)+'ページ';
      if(!data.items.length){box.textContent='該当する顧客が見つかりません';return;}
      data.items.forEach(function(c){
        var row=document.createElement('button');row.type='button';row.className='list-row';row.style.cssText='width:100%;text-align:left;cursor:pointer;background:transparent;color:inherit;font:inherit;min-height:44px;';
        var top=document.createElement('div');top.className='list-row-top';var name=document.createElement('div');name.className='list-row-ticket';name.textContent=c.holderName;var status=document.createElement('span');status.className='tag';status.textContent=STATUS_LABEL[c.status]||c.status;top.appendChild(name);top.appendChild(status);row.appendChild(top);
        var sub=document.createElement('div');sub.className='list-row-sub';sub.textContent=c.planName+' / '+c.passNo+' / '+c.validToLabel;row.appendChild(sub);
        row.addEventListener('click',function(){if(!searchState.busy)loadDetail(c.passNo);});box.appendChild(row);
      });
    }

    var currentPassNo = '';

    function loadDetail(passNo) {
      clearError();var generation=++detailGeneration;
      staffRun()
        .withSuccessHandler(function(d){if(generation===detailGeneration)renderDetail(d);})
        .withFailureHandler(function (err) { if(generation===detailGeneration)showError((err && err.message ? err.message : err)); })
        .getCustomerDetail(passNo);
    }

    function renderDetail(d) {
      currentPassNo = d.passNo;
      document.getElementById('detailCard').style.display = 'block';
      document.getElementById('detailName').textContent = d.holderName;
      document.getElementById('detailStatus').textContent = STATUS_LABEL[d.status] || d.status;
      document.getElementById('detailPlan').textContent = d.planName + '　パス番号：' + d.passNo;
      document.getElementById('detailValid').textContent = '有効期間：' + d.validFromLabel + ' 〜 ' + d.validToLabel;
      document.getElementById('detailValid').textContent += d.lineUserId ? '／LINE連携あり（来場履歴は同じLINEアカウントの受付を表示します）' : '／LINE未連携（窓口で氏名・パス番号から管理します）';
      document.getElementById('detailUsage').textContent =
        (d.usageLimit != null ? ('通算利用回数：' + d.usageCount + ' / ' + d.usageLimit + '回　') : '')
        + '本日の利用登録：' + d.todayRegistrationCount + '件';
      document.getElementById('detailLastUsed').textContent = '最終利用日：' + (d.lastUsedDateLabel || '-');
      document.getElementById('detailReentryBlocked').textContent =
        d.canOverrideReentry ? ('⚠ ' + d.reentryBlockedReasonLabel) : '';

      document.getElementById('overrideBox').style.display = d.canOverrideReentry ? 'block' : 'none';
      document.getElementById('overrideReason').value = '';

      var visitsBox = document.getElementById('visitsList');
      if (d.visits.length === 0) {
        visitsBox.innerHTML = '<div class="empty-hint">来場履歴がありません</div>';
      } else {
        visitsBox.innerHTML = '';
        d.visits.forEach(function (v) {
          var row = document.createElement('div');
          row.className = 'list-row';
          row.innerHTML =
            '<div class="list-row-top"><div class="list-row-ticket">' + v.ticketNo + '</div>' +
            '<span class="tag">' + (QSTATUS_LABEL[v.status] || v.status) + '</span></div>' +
            '<div class="list-row-sub">' + v.dateLabel + '　計' + v.partySize + '名</div>';
          visitsBox.appendChild(row);
        });
      }
    }

    document.getElementById('overrideBtn').addEventListener('click', function () {
      var reason = document.getElementById('overrideReason').value.trim();
      if (!reason) { showError('理由を入力してください'); return; }
      if (!window.confirm(currentPassNo + ' の本日2回目の入場を特例で許可します。よろしいですか？')) return;
      clearError();
      staffRun()
        .withSuccessHandler(function () {
          window.alert('特例許可を記録しました。');
          loadDetail(currentPassNo);
        })
        .withFailureHandler(function (err) { showError((err && err.message ? err.message : err)); })
        .overrideSeasonPassReentryApi(currentPassNo, staffId, reason);
    });

    function loadStaffLabel() {
      if (!staffId) return;
      staffRun()
        .withSuccessHandler(function (staff) {
          if (staff) {
            document.getElementById('staffLabel').textContent =
              staff.staffName + (staff.role === 'ADMIN' ? '（管理者）' : '');
          }
        })
        .getStaffById(staffId);
    }
    renderAdminSidebar('customers');
    loadStaffLabel();
  </script>
</body>
</html>
